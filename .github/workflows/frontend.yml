name: Frontend checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bases/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run format:check
      - run: npm run build
      - run: npm test
